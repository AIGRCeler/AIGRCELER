<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aig-template-version" content="1.1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>AI Governance Dashboard</title>
<style>
/* AIGRCeler dashboard template 1.1. The shape of the page is fixed here. Only the data block at the bottom changes.
   Offline by design: no outside files, fonts or addresses. */
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d67;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --seq-250: #86b6ef; --seq-450: #2a78d6; --seq-600: #184f95; --neutral-bar: #a9a79f;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --info: #2a78d6;
  --good-ink: #006300; --accent: #2a78d6; --mark-ink: #ffffff; --mark-ink-warn: #3b2a00;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e96;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --seq-250: #1c5cab; --seq-450: #3987e5; --seq-600: #6da7ec; --neutral-bar: #6b6962;
    --info: #3987e5; --good-ink: #0ca30c; --accent: #3987e5; --mark-ink: #0d0d0d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e96;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --seq-250: #1c5cab; --seq-450: #3987e5; --seq-600: #6da7ec; --neutral-bar: #6b6962;
  --info: #3987e5; --good-ink: #0ca30c; --accent: #3987e5; --mark-ink: #0d0d0d;
}
* { box-sizing: border-box; }
html { background: var(--plane); }
body { margin: 0; background: var(--plane); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px 48px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--ring); }
header.top .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding-top: 14px; padding-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { height: 36px; max-width: 160px; object-fit: contain; }
.brand h1 { font-size: 18px; margin: 0; font-weight: 650; }
.brand .sub { color: var(--ink2); font-size: 13px; }
.aig-lg { display: inline-flex; align-items: center; }
.aig-lg img { height: 30px; width: auto; max-width: 180px; }
.aig-lg .lg-d { display: none; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .aig-lg .lg-l { display: none; } :root:where(:not([data-theme="light"])) .aig-lg .lg-d { display: inline; } }
:root[data-theme="dark"] .aig-lg .lg-l { display: none; }
:root[data-theme="dark"] .aig-lg .lg-d { display: inline; }
.foot-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.foot-logo .aig-lg img { height: 24px; }
.spacer { flex: 1; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; color: var(--ink2); font-size: 13px; }
button.btn, .btn { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--axis); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button.btn:hover { background: var(--wash); }
.crumbs { padding: 14px 0 4px; color: var(--ink2); font-size: 13px; }
.banner { margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--ring); border-left: 4px solid var(--warning); background: var(--surface); border-radius: 6px; display: flex; gap: 10px; align-items: flex-start; }
.banner.bad { border-left-color: var(--critical); }
h2 { font-size: 16px; margin: 28px 0 10px; font-weight: 650; }
h3 { font-size: 14px; margin: 0 0 8px; font-weight: 650; }
p.note { color: var(--ink2); margin: 4px 0 10px; max-width: 80ch; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 16px; }
.grid { display: grid; gap: 12px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .label { color: var(--ink2); font-size: 12.5px; }
.tile .value { font-size: 26px; font-weight: 600; line-height: 1.15; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tile .sub { color: var(--ink2); font-size: 12.5px; }
.tile .value.small { font-size: 20px; padding: 3px 0; }
td.nw { white-space: nowrap; }
ul.list li > .chip { min-width: 112px; justify-content: flex-start; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--ring); border-radius: 999px; padding: 1px 9px 1px 6px; font-size: 12px; line-height: 1.6; white-space: nowrap; background: var(--surface); color: var(--ink); }
.chip.plain { padding-left: 9px; }
.chip svg { flex: none; }
.tablewrap { overflow-x: auto; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink2); font-size: 12.5px; white-space: nowrap; background: var(--surface); }
th button { all: unset; cursor: pointer; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.small { color: var(--ink2); font-size: 12.5px; }
.empty { padding: 14px; color: var(--ink2); }
.muted { color: var(--ink2); }
.stack { display: flex; gap: 2px; height: 14px; width: 100%; min-width: 80px; }
.stack > span { display: block; height: 100%; min-width: 0; border-radius: 0; }
.stack > span:first-child { border-radius: 4px 0 0 4px; } .stack > span:last-child { border-radius: 0 4px 4px 0; } .stack > span:only-child { border-radius: 4px; }
.stack.empty-bar { background: var(--grid); border-radius: 4px; }
.hatch { background: repeating-linear-gradient(45deg, var(--seq-450) 0 2px, transparent 2px 5px) !important; box-shadow: inset 0 0 0 1px var(--seq-450); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--ink2); font-size: 12.5px; }
.legend span.k { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.meter { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.meter .track { flex: 1; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; min-width: 60px; }
.meter .fill { height: 100%; background: var(--seq-450); border-radius: 4px; }
.meter .txt { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink2); font-size: 12.5px; }
ul.list { list-style: none; padding: 0; margin: 0; }
ul.list li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--grid); }
ul.list li:last-child { border-bottom: 0; }
ul.list li .body { flex: 1; min-width: 0; }
ul.list li .where { color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
.timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.step { position: relative; padding: 0 8px 0 0; }
.step .bar { height: 6px; background: var(--grid); border-radius: 3px; margin-bottom: 8px; }
.step.closed .bar { background: var(--seq-450); }
.step.started .bar { background: repeating-linear-gradient(90deg, var(--seq-450) 0 8px, transparent 8px 12px); }
.step .nm { font-weight: 650; }
.step .st { color: var(--ink2); font-size: 12.5px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--ring); margin: 18px 0 14px; }
.tabs a { padding: 8px 12px; border-radius: 6px 6px 0 0; color: var(--ink2); }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 650; box-shadow: inset 0 -2px 0 var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 10px; color: var(--ink2); font-size: 13px; }
.filters select, .filters input[type=search] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--surface); padding: 5px 9px; border-radius: 6px; font-size: 12.5px; max-width: 320px; display: none; }
footer.foot { margin-top: 36px; color: var(--ink2); font-size: 12.5px; border-top: 1px solid var(--ring); padding-top: 14px; }
svg.spark { display: block; overflow: visible; }
.two-line { display: flex; flex-direction: column; gap: 2px; }
.bandrow { display: grid; grid-template-columns: 150px 1fr 150px; gap: 10px; align-items: center; padding: 5px 0; }
.bandrow .nm { color: var(--ink2); font-size: 13px; }
.bandrow .bars { display: flex; flex-direction: column; gap: 4px; }
.bandrow .bar1 { height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }
.bandrow .val { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 12.5px; text-align: right; }
@media (max-width: 760px) { .bandrow { grid-template-columns: 1fr; } .timeline { grid-template-columns: 1fr 1fr; row-gap: 12px; } .wrap { padding: 0 12px 40px; } }
@media print { header.top .controls, .tabs, .filters { display: none; } body { background: #fff; } }
@media (forced-colors: active) { .stack > span, .meter .fill, .bar1 { forced-color-adjust: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" role="tooltip"></div>
<script type="application/json" id="aig-data">{{AIG_DATA}}</script>
<script>
(function () {
'use strict';

var DATA;
try { DATA = JSON.parse(document.getElementById('aig-data').textContent); }
catch (e) { document.getElementById('app').textContent = 'The dashboard data could not be read. Rebuild it with the dashboard command.'; return; }
var CFG = DATA.config || {};
var HIDE = CFG.hide || [];

/* ---------- small helpers ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); }
  else if (c.nodeType) el.appendChild(c);
  else el.appendChild(document.createTextNode(String(c)));
}
var SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs) {
  var el = document.createElementNS(SVGNS, tag);
  Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
  for (var i = 2; i < arguments.length; i++) if (arguments[i]) el.appendChild(arguments[i]);
  return el;
}
function g(o, path, d) {
  var cur = o;
  var parts = path.split('.');
  for (var i = 0; i < parts.length; i++) { if (cur === null || cur === undefined) return d; cur = cur[parts[i]]; }
  return (cur === null || cur === undefined) ? d : cur;
}
function cap(t) { t = String(t || ''); return t.charAt(0).toUpperCase() + t.slice(1); }
function num(n, dp) { if (n === null || n === undefined || isNaN(n)) return '–'; return Number(n).toFixed(dp === undefined ? 0 : dp); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function day(d) { return d ? String(d).slice(0, 10) : '–'; }
function left(n) { if (n === null || n === undefined) return ''; if (n < 0) return -n + ' days ago'; if (n === 0) return 'today'; return 'in ' + plural(n, 'day'); }

var STATE_LABEL = { drafted: 'Drafted', approved: 'Approved, no owner', assigned: 'Assigned', implementing: 'In progress', evidenced: 'Evidence in, awaiting check',
  verified: 'Verified', monitored: 'Verified and watched', expired: 'Evidence expired', rejected: 'Evidence rejected', waived: 'Waived' };
var STATE_TONE = { verified: 'good', monitored: 'good', implementing: 'info', evidenced: 'info', expired: 'critical', rejected: 'critical' };
var STAGE_LABEL = { DISCOVER: 'Discover', ASSESS: 'Assess', GOVERN: 'Govern', OPERATE: 'Operate' };
var SOURCING = { 'built-in-house': 'Built in house', 'adapted-from-third-party-base': 'Adapted from a third-party base', 'third-party-service': 'Third-party service',
  'self-hosted-open-source': 'Self-hosted open source', 'embedded-in-vendor-product': 'Feature inside a vendor product' };
var BAND_TONE = { Green: 'good', Yellow: 'warning', Orange: 'serious', Red: 'critical', Low: 'good', Medium: 'warning', High: 'serious', Critical: 'critical' };
var SEV_LABEL = { critical: 'Critical', serious: 'Serious', warning: 'Warning', info: 'For information' };
var TOOLTIP = document.getElementById('tip');

function icon(tone, size) {
  size = size || 14;
  var col = 'var(--' + (tone === 'info' ? 'info' : tone) + ')';
  var mk = tone === 'warning' ? 'var(--mark-ink-warn)' : '#ffffff';
  var svg = s('svg', { width: size, height: size, viewBox: '0 0 16 16', 'aria-hidden': 'true' });
  if (tone === 'critical') {
    svg.appendChild(s('circle', { cx: 8, cy: 8, r: 7, fill: col }));
    svg.appendChild(s('rect', { x: 7.2, y: 3.4, width: 1.6, height: 6, fill: mk }));
    svg.appendChild(s('circle', { cx: 8, cy: 11.9, r: 1, fill: mk }));
  } else if (tone === 'serious') {
    svg.appendChild(s('path', { d: 'M8 1.4 L15.2 14.2 H0.8 Z', fill: col }));
    svg.appendChild(s('rect', { x: 7.3, y: 6, width: 1.4, height: 4.2, fill: mk }));
    svg.appendChild(s('circle', { cx: 8, cy: 12, r: 0.9, fill: mk }));
  } else if (tone === 'warning') {
    svg.appendChild(s('path', { d: 'M8 0.8 L15.2 8 L8 15.2 L0.8 8 Z', fill: col }));
    svg.appendChild(s('rect', { x: 7.3, y: 4.6, width: 1.4, height: 4, fill: mk }));
    svg.appendChild(s('circle', { cx: 8, cy: 10.8, r: 0.9, fill: mk }));
  } else if (tone === 'good') {
    svg.appendChild(s('circle', { cx: 8, cy: 8, r: 7, fill: col }));
    svg.appendChild(s('path', { d: 'M4.6 8.2 L7 10.6 L11.5 5.6', fill: 'none', stroke: '#ffffff', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  } else {
    svg.appendChild(s('circle', { cx: 8, cy: 8, r: 6.2, fill: 'none', stroke: col, 'stroke-width': 1.6 }));
    svg.appendChild(s('rect', { x: 7.3, y: 7, width: 1.4, height: 4.2, fill: col }));
    svg.appendChild(s('circle', { cx: 8, cy: 4.8, r: 0.95, fill: col }));
  }
  return svg;
}
function chip(text, tone, tip) {
  if (!tone || tone === 'neutral') return h('span', { class: 'chip plain', 'data-tip': tip, tabindex: tip ? '0' : null }, text);
  return h('span', { class: 'chip', 'data-tip': tip, tabindex: tip ? '0' : null }, icon(tone, 13), text);
}
function sevChip(sev) { return chip(SEV_LABEL[sev] || sev, sev === 'info' ? 'info' : sev); }
function bandChip(b) { return b ? chip(b, BAND_TONE[b] || 'neutral') : h('span', { class: 'muted', text: '–' }); }
function stateChip(st) { return chip(STATE_LABEL[st] || st, STATE_TONE[st] || 'neutral'); }

function tile(label, value, sub, extra) {
  var small = typeof value === 'string' && value.length > 7;
  return h('div', { class: 'tile' }, h('div', { class: 'label', text: label }), h('div', { class: 'value' + (small ? ' small' : '') }, value, extra), sub ? h('div', { class: 'sub', text: sub }) : null);
}
function meter(done, total, tip) {
  var pct = total ? Math.round(100 * done / total) : 0;
  return h('div', { class: 'meter', 'data-tip': tip || (done + ' of ' + total), tabindex: '0' },
    h('div', { class: 'track' }, h('div', { class: 'fill', style: 'width:' + pct + '%' })),
    h('span', { class: 'txt', text: done + ' of ' + total }));
}
function link(text, href) { return h('a', { href: href, text: text }); }

/* stacked bar: segs = [{v, color, hatch, label}] */
function stack(segs, tipTitle) {
  var total = segs.reduce(function (a, x) { return a + (x.v || 0); }, 0);
  if (!total) return h('div', { class: 'stack empty-bar', 'aria-label': 'nothing to show' });
  var el = h('div', { class: 'stack', role: 'img', 'aria-label': (tipTitle ? tipTitle + ': ' : '') + segs.filter(function (x) { return x.v; }).map(function (x) { return x.v + ' ' + x.label; }).join(', ') });
  segs.forEach(function (x) {
    if (!x.v) return;
    el.appendChild(h('span', { class: x.hatch ? 'hatch' : '', style: 'flex:' + x.v + ' 1 0;' + (x.hatch ? '' : 'background:' + x.color), 'data-tip': x.v + ' ' + x.label, tabindex: '0' }));
  });
  return el;
}
var GROUP_SEGS = [
  { k: 'in_place', label: 'verified', color: 'var(--seq-450)' },
  { k: 'in_progress', label: 'in progress or awaiting a check', color: 'var(--seq-250)' },
  { k: 'waiting', label: 'waiting to start', color: 'var(--neutral-bar)' },
  { k: 'problem', label: 'evidence expired or rejected', color: 'var(--critical)' },
  { k: 'waived', label: 'waived', hatch: true }
];
function groupBar(groups) {
  return stack(GROUP_SEGS.map(function (x) { return { v: groups[x.k] || 0, label: x.label, color: x.color, hatch: x.hatch }; }));
}
function legend(items) {
  return h('div', { class: 'legend' }, items.map(function (x) {
    return h('span', { class: 'k' }, h('i', { class: x.hatch ? 'hatch' : '', style: x.hatch ? '' : 'background:' + x.color }), x.label);
  }));
}
function groupLegend() { return legend(GROUP_SEGS); }

function spark(values, opt) {
  opt = opt || {};
  var w = opt.w || 140, hh = opt.h || 36, pad = 5;
  var vals = values.filter(function (v) { return v !== null && v !== undefined; });
  if (vals.length < 2) return null;
  var lo = opt.lo !== undefined ? opt.lo : Math.min.apply(null, vals);
  var hi = opt.hi !== undefined ? opt.hi : Math.max.apply(null, vals);
  if (hi === lo) { hi = lo + 1; }
  var pts = values.map(function (v, i) {
    if (v === null || v === undefined) return null;
    return [pad + i * (w - 2 * pad) / Math.max(1, values.length - 1), hh - pad - (v - lo) * (hh - 2 * pad) / (hi - lo)];
  }).filter(Boolean);
  var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var last = pts[pts.length - 1];
  var svg = s('svg', { class: 'spark', width: w, height: hh, viewBox: '0 0 ' + w + ' ' + hh, role: 'img', 'aria-label': opt.label || 'trend' });
  svg.appendChild(s('path', { d: d, fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  svg.appendChild(s('circle', { cx: last[0], cy: last[1], r: 4, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }));
  return svg;
}

var NOWRAP = { who: 1, id: 1, control: 1, opened: 1, due: 1, updated: 1, raised: 1, ends: 1, time: 1, seq: 1, valid_until: 1, until: 1, expires: 1, level: 1, severity: 1, state: 1, open: 1, late: 1 };
/* sortable table. cols: [{key,label,num,render(row),val(row),small}] */
function table(cols, rows, opt) {
  opt = opt || {};
  var st = { key: opt.sort || null, dir: opt.dir || 1 };
  var wrap = h('div', { class: 'tablewrap' });
  function draw() {
    wrap.textContent = '';
    if (!rows.length) { wrap.appendChild(h('div', { class: 'empty', text: opt.empty || 'Nothing to show.' })); return; }
    var data = rows.slice();
    if (st.key) {
      var c = cols.filter(function (x) { return x.key === st.key; })[0];
      if (c) {
        var f = c.val || function (r) { return r[c.key]; };
        data.sort(function (a, b) {
          var x = f(a), y = f(b);
          if (x === y) return 0;
          if (x === null || x === undefined || x === '') return 1;
          if (y === null || y === undefined || y === '') return -1;
          return (x < y ? -1 : 1) * st.dir;
        });
      }

function aigLogo() { return h('span', { class: 'aig-lg' }, h('img', { class: 'lg-l', src: AIG_LOGO.l, alt: 'AIGRCeler' }), h('img', { class: 'lg-d', src: AIG_LOGO.d, alt: '' })); }
function setTheme(t) { try { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); } catch (e) {} }
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } return null; }

var refreshOn = store('aig-refresh') !== 'off';
var timer = null;
function tick() {
  if (!refreshOn) return;
  var a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA')) return;
  location.reload();
}

function render() {
  var app = document.getElementById('app');
  app.textContent = '';
  var r = parseHash();
  var gen = ago(DATA.generated);
  document.title = (CFG.title || 'AI Governance Dashboard') + ' – ' + g(DATA, 'company.name', '');
  if (CFG.accent) document.documentElement.style.setProperty('--accent', CFG.accent);
  var themeBtn = h('button', { type: 'button', class: 'btn', onclick: function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark'; setTheme(next); store('aig-theme', next); } }, 'Light or dark');
  var auto = h('label', {}, h('input', { type: 'checkbox', checked: refreshOn ? '' : null, onchange: function (e) { refreshOn = e.target.checked; store('aig-refresh', refreshOn ? 'on' : 'off'); } }), ' Reload every minute');
  var intact = g(DATA, 'company.journal.intact', true);
  var anyBad = !intact || (DATA.systems || []).some(function (x) { return !g(x, 'decisions.intact', true); });
  var header = h('header', { class: 'top' }, h('div', { class: 'wrap' },
    h('div', { class: 'brand' }, CFG.logo ? h('img', { src: CFG.logo, alt: '' }) : aigLogo(),
      h('div', {}, h('h1', {}, link(CFG.title || 'AI Governance Dashboard', '#/')), h('div', { class: 'sub', text: g(DATA, 'company.name', '') + ' · generated ' + String(DATA.generated || '').slice(0, 16).replace('T', ' ') + ' (' + gen.text + ')' }))),
    h('div', { class: 'spacer' }),
    h('div', { class: 'controls' }, anyBad ? chip('Journal problem', 'critical', 'A decision journal does not check out. See the Decisions tab.') : chip('Journals intact', 'good', 'Every decision journal checks out'), auto, themeBtn)));
  app.appendChild(header);
  var main = h('main', { class: 'wrap' });
  if (gen.hours > 24) main.appendChild(h('div', { class: 'banner' }, icon('warning', 18), h('div', { text: 'This page was built ' + gen.text + '. Anything that changed since then is not shown. Rebuild it from the AIGRCeler menu (D) or with the dashboard command.' })));
  if (r.view === 'system') {
    var sy = sysOf(r.slug);
    main.appendChild(h('div', { class: 'crumbs' }, link('All AI systems', '#/'), ' / ', sy ? sy.name : r.slug));
    main.appendChild(sy ? systemView(sy, r.tab) : h('div', { class: 'card muted', text: 'There is no AI system called "' + r.slug + '" in this dashboard.' }));
  } else {
    main.appendChild(h('div', { class: 'crumbs', text: 'All AI systems' }));
    main.appendChild(companyView());
  }
  main.appendChild(h('footer', { class: 'foot' },
    h('div', { class: 'foot-logo' }, aigLogo(), h('span', { text: 'Prepared with AIGRCeler' })),
    'AIGRCeler ' + (DATA.engine_version || '') + ' · dashboard template ' + (DATA.template_version || '') + ' · data format ' + (DATA.contract || '') + '. ',
    'This page only reads the records; nothing here can be edited, and changes go through AIGRCeler. It is not legal advice, a certification or a statement that the company complies.'));
  app.appendChild(main);
}

document.addEventListener('pointerover', function (e) {
  var t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!t) return;
  TOOLTIP.textContent = t.getAttribute('data-tip'); TOOLTIP.style.display = 'block';
});
document.addEventListener('pointermove', function (e) {
  if (TOOLTIP.style.display !== 'block') return;
  TOOLTIP.style.left = Math.min(window.innerWidth - 330, e.clientX + 14) + 'px'; TOOLTIP.style.top = (e.clientY + 16) + 'px';
});
document.addEventListener('pointerout', function (e) { var t = e.target.closest ? e.target.closest('[data-tip]') : null; if (t) TOOLTIP.style.display = 'none'; });
document.addEventListener('focusin', function (e) {
  var t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!t) return;
  var b = t.getBoundingClientRect();
  TOOLTIP.textContent = t.getAttribute('data-tip'); TOOLTIP.style.display = 'block';
  TOOLTIP.style.left = Math.max(8, Math.min(window.innerWidth - 330, b.left)) + 'px'; TOOLTIP.style.top = (b.bottom + 6) + 'px';
});
document.addEventListener('focusout', function () { TOOLTIP.style.display = 'none'; });
window.addEventListener('hashchange', function () { routeHash = null; render(); window.scrollTo(0, 0); });
window.addEventListener('popstate', function () { routeHash = null; render(); window.scrollTo(0, 0); });
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  var href = a.getAttribute('href');
  routeHash = href;
  try { if (location.hash !== href) history.pushState(null, '', href); } catch (err) {}
  render(); window.scrollTo(0, 0);
});
var savedTheme = store('aig-theme'); if (savedTheme) setTheme(savedTheme);
render();
timer = setInterval(tick, 60000);
})();
</script>
